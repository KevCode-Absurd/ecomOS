<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meta ads report</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/report.css">
</head>
<body class="report">
<div class="toolbar no-print">
  <label>Agency <input id="agency" type="text" maxlength="80" placeholder="Your agency name"></label>
  <label>Client <input id="client" type="text" maxlength="80" placeholder="Client name"></label>
  <label class="grow">Note on the cover <input id="note" type="text" maxlength="400" placeholder="Optional one-line summary for the client"></label>
  <button id="saveBrand" class="btn ghost" type="button">Save branding</button>
  <button id="print" class="btn" type="button">Print or save as PDF</button>
  <span id="msg" class="small muted"></span>
</div>
<main id="doc" class="doc"><p class="muted">Loading…</p></main>
<script src="/static/common.js"></script>
<script src="/static/report.js"></script>
</body>
</html>
