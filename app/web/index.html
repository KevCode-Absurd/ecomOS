<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ecomOS</title>
<link rel="stylesheet" href="/web/ui-kit.css">
<style>
  body { overflow: hidden; }
  .shell { display: grid; grid-template-rows: auto auto 1fr; height: 100vh; height: 100dvh; }
  .topbar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--surface); border-bottom: 1px solid var(--line); min-width: 0; }
  .logo { font-weight: 800; font-size: 17px; letter-spacing: -.02em; white-space: nowrap; }
  .logo small { font-weight: 500; color: var(--muted); font-size: 12px; margin-left: 6px; }
  .topbar select { flex: 1; min-width: 0; padding: 7px 10px; border: 1px solid var(--line-strong); border-radius: var(--r-sm); background: var(--sunken); }
  .topbar .brandpill { display: none; }
  .theme { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 5px 10px; font-size: 12.5px; }
  .body { display: grid; grid-template-columns: 1fr; min-height: 0; }
  .nav { display: none; }
  .stage { min-width: 0; min-height: 0; display: grid; grid-template-rows: 1fr; background: var(--ground); }
  .stage iframe { width: 100%; height: 100%; border: 0; background: var(--ground); }
  .stage .empty { padding: 20px; overflow: auto; display: grid; gap: 14px; align-content: start; }
  .sample-strip { padding: 0 12px 8px; background: var(--surface); border-bottom: 1px solid var(--line); }
  @media (min-width: 900px) {
    .shell { grid-template-rows: 1fr; }
    .topbar { display: none; }
    .body { grid-template-columns: 250px 1fr; }
    .nav { display: flex; flex-direction: column; gap: 14px; padding: 16px 12px; background: var(--surface); border-right: 1px solid var(--line); overflow: auto; }
    .nav .logo { padding: 2px 10px; }
    .nav .brandcard { display: grid; gap: 2px; padding: 10px 12px; border-radius: var(--r-md); background: var(--accent-soft); border: 1px solid var(--accent-line); font-size: 12.5px; }
    .nav .brandcard b { font-size: 14px; }
    .navlist { display: grid; gap: 2px; }
    .navlist a { display: flex; align-items: center; gap: 9px; padding: 7px 10px; border-radius: 9px; color: var(--muted); font-weight: 600; text-decoration: none; font-size: 13.5px; }
    .navlist a .n { font-family: var(--mono); font-size: 11px; color: var(--faint); width: 20px; flex: none; }
    .navlist a .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--line-strong); flex: none; margin-left: auto; }
    .navlist a.built .dot { background: var(--good); }
    .navlist a:hover { background: var(--sunken); color: var(--ink); }
    .navlist a.sel { background: var(--accent); color: var(--on-accent); }
    .navlist a.sel .n, .navlist a.sel .dot { color: var(--on-accent); }
    .navlist a.sel.built .dot { background: var(--on-accent); }
    .navlist .phase { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--faint); padding: 10px 10px 2px; font-weight: 600; }
    .nav-foot { margin-top: auto; display: grid; gap: 8px; font-size: 12px; color: var(--muted); padding: 0 6px; }
    .sample-strip { display: none; }
  }
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="logo">ecomOS</div>
    <select id="screen-select" aria-label="Screen"></select>
    <button class="theme" id="theme-btn-m" type="button" aria-label="Theme">auto</button>
  </header>
  <div class="sample-strip" id="sample-strip"></div>
  <div class="body">
    <nav class="nav" aria-label="Screens">
      <div class="logo">ecomOS<small>local</small></div>
      <div class="brandcard" id="brandcard"><b>Loading brand</b></div>
      <div class="navlist" id="navlist"></div>
      <div class="nav-foot">
        <span id="built-count"></span>
        <span>Read-only. Meta, Shopify and the rest are never written to.</span>
        <button class="theme" id="theme-btn" type="button">Theme: auto</button>
      </div>
    </nav>
    <main class="stage" id="stage"></main>
  </div>
</div>
<script src="/web/ui-kit.js"></script>
<script src="/web/shell.js"></script>
</body>
</html>
