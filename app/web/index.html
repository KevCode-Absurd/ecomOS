<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ecomOS</title>
<link rel="stylesheet" href="/web/ui-kit.css">
<style>
  body { overflow: hidden; }
  .shell { display: grid; grid-template-rows: auto auto 1fr; height: 100vh; height: 100dvh; }
  .topbar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--surface); border-bottom: 1px solid var(--line); min-width: 0; }
  .logo { font-weight: 800; font-size: 16px; letter-spacing: -.03em; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
  .logo .mark { width: 22px; height: 22px; border-radius: 7px; background: linear-gradient(135deg, var(--accent), var(--s3)); display: inline-grid; place-items: center; color: #fff; font-size: 11px; font-weight: 800; letter-spacing: 0; }
  .logo small { font-weight: 500; color: var(--faint); font-size: 11px; margin-left: 2px; letter-spacing: 0; }
  .topbar select { flex: 1; min-width: 0; padding: 7px 10px; border: 1px solid var(--line-strong); border-radius: var(--r-sm); background: var(--sunken); }
  .theme { border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--r-sm); padding: 5px 10px; font-size: 12px; color: var(--muted); }
  .body { display: grid; grid-template-columns: 1fr; min-height: 0; }
  .nav { display: none; }
  .stage { min-width: 0; min-height: 0; display: grid; grid-template-rows: 1fr; background: var(--ground); }
  .stage iframe { width: 100%; height: 100%; border: 0; background: var(--ground); }
  .stage .empty { padding: 20px; overflow: auto; display: grid; gap: 14px; align-content: start; }
  .sample-strip { padding: 0 12px 8px; background: var(--surface); border-bottom: 1px solid var(--line); }
  @media (min-width: 900px) {
    .shell { grid-template-rows: 1fr; }
    .topbar { display: none; }
    .body { grid-template-columns: 236px 1fr; }
    .nav { display: flex; flex-direction: column; gap: 12px; padding: 14px 10px; background: var(--surface); border-right: 1px solid var(--line); overflow: auto; scrollbar-width: thin; }
    .nav .logo { padding: 2px 8px 4px; }
    .nav .brandcard { display: grid; gap: 3px; padding: 10px 12px; border-radius: var(--r-md); background: var(--sunken); border: 1px solid var(--line); font-size: 12px; color: var(--muted); }
    .nav .brandcard b { font-size: 13.5px; color: var(--ink); }
    .nav .brandcard .approve { margin-top: 4px; display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--accent); text-decoration: none; }
    .nav .brandcard .approve .n { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 6px; background: var(--accent); color: var(--on-accent); font-size: 11.5px; font-variant-numeric: tabular-nums; }
    .nav .search { width: 100%; padding: 6px 10px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--sunken); font-size: 12.5px; }
    .navlist { display: grid; gap: 1px; }
    .navlist a { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 7px; color: var(--muted); font-weight: 550; text-decoration: none; font-size: 13px; }
    .navlist a .n { font-family: var(--mono); font-size: 10.5px; color: var(--faint); width: 18px; flex: none; }
    .navlist a .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--line-strong); flex: none; margin-left: auto; }
    .navlist a.built .dot { background: var(--good); }
    .navlist a:hover { background: var(--sunken); color: var(--ink); }
    .navlist a.sel { background: var(--accent-soft); color: var(--accent); font-weight: 650; }
    .navlist a.sel .n { color: var(--accent); }
    .navlist a.sel .dot { background: var(--accent); }
    .navlist a[hidden] { display: none; }
    .navlist .phase { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); padding: 10px 8px 3px; font-weight: 600; }
    .nav-foot { margin-top: auto; display: grid; gap: 6px; font-size: 11.5px; color: var(--faint); padding: 0 4px; }
    .sample-strip { display: none; }
  }
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="logo"><span class="mark">e</span>ecomOS</div>
    <select id="screen-select" aria-label="Screen"></select>
    <button class="theme" id="theme-btn-m" type="button" aria-label="Theme">auto</button>
  </header>
  <div class="sample-strip" id="sample-strip"></div>
  <div class="body">
    <nav class="nav" aria-label="Screens">
      <div class="logo"><span class="mark">e</span>ecomOS<small>operating system</small></div>
      <div class="brandcard" id="brandcard"><b>Loading brand</b></div>
      <input class="search" id="nav-search" type="search" placeholder="Find a screen" aria-label="Find a screen">
      <div class="navlist" id="navlist"></div>
      <div class="nav-foot">
        <span id="built-count"></span>
        <span>Read-only. Meta, Shopify and the rest are never written to.</span>
        <button class="theme" id="theme-btn" type="button">Theme: auto</button>
      </div>
    </nav>
    <main class="stage" id="stage"></main>
  </div>
</div>
<script src="/web/ui-kit.js"></script>
<script src="/web/shell.js"></script>
</body>
</html>
