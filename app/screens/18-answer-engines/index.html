<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Answer engines</title>
<link rel="stylesheet" href="/web/ui-kit.css">
<style>
  .sim { padding: 8px 12px; border-radius: var(--r-md); background: var(--accent-soft); border: 1px solid var(--accent-line); font-size: 13px; }
  .screen { min-width: 0; overflow-x: hidden; }
  .section, .card { min-width: 0; }
  .grid.tiles.three { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .th { color: var(--muted); font-size: 12.5px; margin: 0 0 10px; }
  .card.scroll { overflow-x: auto; }
  .actions { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  .actions h4 { margin: 0 0 6px; font-size: 14px; }
  .finding { border-top: 1px solid var(--line); padding: 10px 0; display: grid; gap: 4px; }
  .finding:first-child { border-top: 0; }
  .finding .money { font-family: var(--mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
</style>
</head>
<body data-screen="18-answer-engines">
<main class="screen" id="app">
  <header class="screen-head"><h1>Answer engines</h1></header>
  <p>Loading.</p>
</main>
<script src="/web/ui-kit.js"></script>
<script src="/web/charts.js"></script>
<script src="screen.js"></script>
</body>
</html>
