<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setup · ecomOS</title>
<link rel="stylesheet" href="/web/ui-kit.css">
<style>
  .steps { display: flex; flex-wrap: wrap; gap: 6px; }
  .steps a { text-decoration: none; }
  .step-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .step-head .n { font-family: var(--mono); font-size: 12px; color: var(--faint); }
  .form { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); align-items: end; }
  .form label { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); font-weight: 600; }
  .form .wide { grid-column: 1 / -1; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chips .chip { white-space: normal; }
  .cats { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); }
  .cat { display: grid; gap: 8px; align-content: start; }
  .cat h4 { margin: 0; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .cat .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  .q { display: grid; gap: 8px; }
  .q .imp { font-family: var(--mono); font-size: 12px; color: var(--faint); }
  .msg { font-size: 13px; }
  .msg.err { color: var(--bad); }
  .msg.ok { color: var(--good); }
  .metrics { display: grid; gap: 4px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); font-size: 13px; }
  .metrics div { display: flex; gap: 8px; align-items: baseline; }
  input.text[type=file] { padding: 6px; }
</style>
</head>
<body data-screen="setup">
<main class="screen" id="app">
  <header class="screen-head">
    <h1>Set up your store</h1>
    <p>Five steps. Each one fills the brand brain. Skip any step and see what stays unavailable.</p>
  </header>
  <div id="badge"></div>
  <div id="note"></div>
  <div class="grid tiles" id="tiles"></div>
  <nav class="steps" id="steps" aria-label="Steps"></nav>
  <section class="section" id="step-1"></section>
  <section class="section" id="step-2"></section>
  <section class="section" id="step-3"></section>
  <section class="section" id="step-4"></section>
  <section class="section" id="step-5"></section>
</main>
<script src="/web/ui-kit.js"></script>
<script src="/web/charts.js"></script>
<script src="screen.js"></script>
</body>
</html>
