<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store health</title>
<link rel="stylesheet" href="/web/ui-kit.css">
<style>
  .sim { padding: 8px 12px; border-radius: var(--r-md); background: var(--accent-soft); border: 1px solid var(--accent-line); font-size: 13px; }
  .grid.tiles.four { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
  .screen { min-width: 0; overflow-x: hidden; }
  .section, .card { min-width: 0; }
  .th { color: var(--muted); font-size: 12.5px; margin: 0 0 10px; }
  .wrap table.kit td { white-space: normal; min-width: 80px; }
  .wrap .table-wrap { max-height: none; }
  .table-wrap { overflow-x: auto; }
  .check-group { margin: 12px 0 4px; font-weight: 600; font-size: 13px; }
  .check { display: grid; grid-template-columns: 96px 1fr; gap: 4px 12px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .check .label { font-weight: 600; }
  .check .detail, .check .src { color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; }
  .check .body { min-width: 0; display: grid; gap: 2px; }
  .legs { display: grid; gap: 12px; grid-template-columns: 1fr; }
  @media (min-width: 900px) { .legs { grid-template-columns: repeat(3, 1fr); } }
  .leg h4 { margin: 0 0 6px; font-size: 14px; }
  .kv { display: grid; gap: 4px 12px; grid-template-columns: max-content 1fr; font-size: 13px; margin: 6px 0 0; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .chart-pair { display: grid; gap: 8px; grid-template-columns: 1fr; }
  .chart-pair > * { min-width: 0; }
  @media (min-width: 900px) { .chart-pair { grid-template-columns: 1fr 1fr; } }
  .finding { border-top: 1px solid var(--line); padding: 10px 0; display: grid; gap: 4px; }
  .finding:first-child { border-top: 0; }
  .finding .money { font-family: var(--mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
</style>
</head>
<body data-screen="06-store-health">
<main class="screen" id="app">
  <header class="screen-head"><h1>Store health</h1></header>
  <p>Loading.</p>
</main>
<script src="/web/ui-kit.js"></script>
<script src="/web/charts.js"></script>
<script src="screen.js"></script>
</body>
</html>
