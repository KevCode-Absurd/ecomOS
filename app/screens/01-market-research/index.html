<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Products and research</title>
<link rel="stylesheet" href="/web/ui-kit.css">
<style>
  .sim { padding: 8px 12px; border-radius: var(--r-md); background: var(--accent-soft); border: 1px solid var(--accent-line); font-size: 13px; }
  .screen { min-width: 0; overflow-x: hidden; }
  .section, .card { min-width: 0; }
  .grid.tiles.three { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .th { color: var(--muted); font-size: 12.5px; margin: 0 0 10px; }
  .table-wrap, .card.scroll { overflow-x: auto; }
  .reviews { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .review h4 { margin: 0 0 2px; font-size: 14px; }
  .review .stat { color: var(--muted); font-size: 12.5px; margin-bottom: 8px; }
  .review ul { margin: 2px 0 8px; padding-left: 18px; font-size: 13px; }
  .review .lbl { font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .review .lbl.good { color: var(--good, inherit); }
  .review .lbl.bad { color: var(--bad, inherit); }
  .review .rung { font-size: 12px; color: var(--muted); }
  .gate { font-size: 13px; margin: 0 0 10px; }
  .finding { border-top: 1px solid var(--line); padding: 10px 0; display: grid; gap: 4px; }
  .finding:first-child { border-top: 0; }
  .finding .money { font-family: var(--mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
</style>
</head>
<body data-screen="01-market-research">
<main class="screen" id="app">
  <header class="screen-head"><h1>Products and research</h1></header>
  <p>Loading.</p>
</main>
<script src="/web/ui-kit.js"></script>
<script src="/web/charts.js"></script>
<script src="screen.js"></script>
</body>
</html>
