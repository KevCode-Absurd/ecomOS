<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supply and inventory</title>
<link rel="stylesheet" href="/web/ui-kit.css">
<style>
  .sim { padding: 8px 12px; border-radius: var(--r-md); background: var(--accent-soft); border: 1px solid var(--accent-line); font-size: 13px; }
  .grid.tiles.three { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  .screen { min-width: 0; overflow-x: hidden; }
  .section, .card { min-width: 0; }
  .th { color: var(--muted); font-size: 12.5px; margin: 0 0 10px; }
  .table-wrap { overflow-x: auto; }
  .finding { border-top: 1px solid var(--line); padding: 10px 0; display: grid; gap: 4px; }
  .finding:first-child { border-top: 0; }
  .finding .money { font-family: var(--mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .missing { display: grid; gap: 6px; grid-template-columns: 1fr; font-size: 13px; }
  @media (min-width: 900px) { .missing { grid-template-columns: 1fr 1fr; } }
  .missing .row { display: grid; gap: 2px; padding: 8px 0; border-top: 1px solid var(--line); }
  .missing .muted { color: var(--muted); font-size: 12.5px; }
</style>
</head>
<body data-screen="19-supply-inventory">
<main class="screen" id="app">
  <header class="screen-head"><h1>Supply and inventory</h1></header>
  <p>Loading.</p>
</main>
<script src="/web/ui-kit.js"></script>
<script src="/web/charts.js"></script>
<script src="screen.js"></script>
</body>
</html>
