<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240" role="img" aria-label="Orders by weekday, index to the average day" class="rv">

<style>
.rv{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:12px}
.rv .ink{fill:#0b0b0b}.rv .sec{fill:#52514e}.rv .mut{fill:#898781}
.rv .grid{stroke:#e1e0d9;stroke-width:1}.rv .axis{stroke:#c3c2b7;stroke-width:1}
.rv .surf{fill:#fcfcfb}.rv .ring{stroke:#fcfcfb}
.rv .s1{fill:#2a78d6}.rv .s2{fill:#eb6834}.rv .s3{fill:#1baf7a}.rv .s4{fill:#eda100}.rv .s5{fill:#e87ba4}.rv .s6{fill:#008300}.rv .s7{fill:#4a3aa7}
.rv .l1{stroke:#2a78d6}.rv .l2{stroke:#eb6834}.rv .l3{stroke:#1baf7a}.rv .l4{stroke:#eda100}
.rv .ref{stroke:#898781;stroke-width:1.5}
@media (prefers-color-scheme: dark){
.rv .ink{fill:#ffffff}.rv .sec{fill:#c3c2b7}.rv .mut{fill:#898781}
.rv .grid{stroke:#2c2c2a}.rv .axis{stroke:#383835}.rv .surf{fill:#1a1a19}.rv .ring{stroke:#1a1a19}
.rv .s1{fill:#3987e5}.rv .s2{fill:#d95926}.rv .s3{fill:#199e70}.rv .s4{fill:#c98500}.rv .s5{fill:#d55181}.rv .s6{fill:#008300}.rv .s7{fill:#9085e9}
.rv .l1{stroke:#3987e5}.rv .l2{stroke:#d95926}.rv .l3{stroke:#199e70}.rv .l4{stroke:#c98500}
}
</style>
<rect class="surf" x="0" y="0" width="720" height="240" rx="6"/>
<text class="ink" x="56" y="18" font-weight="600">Orders by weekday, index to the average day</text>
<line class="grid" x1="56" y1="200.0" x2="704" y2="200.0"/>
<text class="mut" x="50" y="204.0" text-anchor="end" font-size="11">0</text>
<line class="grid" x1="56" y1="133.8" x2="704" y2="133.8"/>
<text class="mut" x="50" y="137.8" text-anchor="end" font-size="11">0.5</text>
<line class="grid" x1="56" y1="67.7" x2="704" y2="67.7"/>
<text class="mut" x="50" y="71.7" text-anchor="end" font-size="11">1</text>
<rect class="s1" x="90.3" y="63.5" width="24.0" height="136.5" rx="3"/>
<text class="mut" x="102.3" y="214" text-anchor="middle" font-size="10">Mon</text>
<rect class="s1" x="182.9" y="71.7" width="24.0" height="128.3" rx="3"/>
<text class="mut" x="194.9" y="214" text-anchor="middle" font-size="10">Tue</text>
<rect class="s1" x="275.4" y="74.2" width="24.0" height="125.8" rx="3"/>
<text class="mut" x="287.4" y="214" text-anchor="middle" font-size="10">Wed</text>
<rect class="s1" x="368.0" y="75.8" width="24.0" height="124.2" rx="3"/>
<text class="mut" x="380.0" y="214" text-anchor="middle" font-size="10">Thu</text>
<rect class="s1" x="460.6" y="67.3" width="24.0" height="132.7" rx="3"/>
<text class="mut" x="472.6" y="214" text-anchor="middle" font-size="10">Fri</text>
<rect class="s1" x="553.1" y="61.5" width="24.0" height="138.5" rx="3"/>
<text class="mut" x="565.1" y="214" text-anchor="middle" font-size="10">Sat</text>
<rect class="s1" x="645.7" y="60.0" width="24.0" height="140.0" rx="3"/>
<text class="mut" x="657.7" y="214" text-anchor="middle" font-size="10">Sun</text>
<line class="ref" x1="56" y1="67.7" x2="704" y2="67.7"/>
<text class="sec" x="704" y="63.7" text-anchor="end" font-size="11">average day</text>
<text class="ink" x="657.7" y="55.0" text-anchor="middle" font-size="11">1.06</text>
<line class="axis" x1="56" y1="200" x2="704" y2="200"/>
</svg>